# ============================================================
# myblog — Jekyll 配置文件
# 托管于 GitHub Pages，零成本、零依赖付费服务
# ============================================================

title: 我的博客
tagline: 安静写字的地方
description: >-
  个人技术笔记与生活随笔，用最简单的工具记录思考。

url: ""                    # GitHub Pages 会自动设置
baseurl: "/myblog"         # 仓库名（如果仓库名就是 myblog）
                           # 如果仓库是 username.github.io，请把这一行删掉
                           # 或改为 baseurl: ""

author: 博主
lang: zh-CN
timezone: Asia/Shanghai

# Markdown 渲染
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  hard_wrap: false

# 文章永久链接
permalink: /:year/:month/:day/:title/

# 默认 Front Matter
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post

# 排除不需要处理的文件和目录
exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor/
